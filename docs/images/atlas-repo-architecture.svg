<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Atlas repository architecture</title>
  <desc id="desc">Diagram showing how atlas-community, atlas-contracts, fabric, atlas-enterprise, portic-community and portic-sdk relate, including NuGet and npm package distribution.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #10233a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #39516d; }
      .section { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-body { font-size: 14px; fill: #29405c; }
      .label { font-size: 13px; font-weight: 600; fill: #375270; }
      .small { font-size: 12px; fill: #4f6781; }
      .card { rx: 18; ry: 18; stroke-width: 2; }
      .public { fill: #f5fbff; stroke: #4a90c2; }
      .runtime { fill: #f9f5ec; stroke: #c58b2c; }
      .private { fill: #fff1f1; stroke: #ca5a5a; }
      .registry { fill: #f4f8f1; stroke: #7aa05f; }
      .note { fill: #f7f7fa; stroke: #99a6b6; }
      .group { fill: #fcfdff; stroke: #d6dfe8; stroke-width: 2; rx: 24; ry: 24; }
      .line-blue { stroke: #4a90c2; }
      .line-gold { stroke: #c58b2c; }
      .line-red { stroke: #ca5a5a; }
      .line-green { stroke: #7aa05f; }
      .line-gray { stroke: #7d8da1; }
      .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 10 8; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90c2"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c58b2c"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ca5a5a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa05f"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8da1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>

  <text x="60" y="62" class="title">Atlas community repository architecture</text>
  <text x="60" y="92" class="subtitle">Technical view of the public Atlas runtime, the shared contract layer, and why the same contracts ship to NuGet and npm.</text>

  <rect x="50" y="125" width="1030" height="260" class="group"/>
  <text x="74" y="158" class="section">Shared contract layer (permissive boundary)</text>

  <rect x="80" y="185" width="290" height="160" class="card public"/>
  <text x="102" y="216" class="box-title">fabric</text>
  <text x="102" y="242" class="box-body">Cross-cutting public contracts:</text>
  <text x="102" y="264" class="box-body">identity, tenancy, RBAC, audit,</text>
  <text x="102" y="286" class="box-body">entitlements, taxonomy, AI contract.</text>
  <text x="102" y="316" class="small">Products depend on Fabric packages.</text>

  <rect x="420" y="185" width="320" height="160" class="card public"/>
  <text x="442" y="216" class="box-title">atlas-contracts</text>
  <text x="442" y="242" class="box-body">Atlas domain contracts:</text>
  <text x="442" y="264" class="box-body">schemas, import/export documents,</text>
  <text x="442" y="286" class="box-body">conformance kit, .NET SDK, TS SDK.</text>
  <text x="442" y="316" class="small">Owns the portable landscape data model.</text>

  <rect x="790" y="185" width="260" height="160" class="card public"/>
  <text x="812" y="216" class="box-title">portic-sdk</text>
  <text x="812" y="242" class="box-body">Apache SDK boundary for Portic:</text>
  <text x="812" y="264" class="box-body">client SDKs and provider SPI.</text>
  <text x="812" y="294" class="small">Same separation pattern as Atlas.</text>

  <rect x="1120" y="125" width="230" height="260" class="group"/>
  <text x="1144" y="158" class="section">Package registries</text>

  <rect x="1150" y="190" width="170" height="72" class="card registry"/>
  <text x="1208" y="220" class="box-title">NuGet</text>
  <text x="1172" y="243" class="small">.NET runtime and backend consumers</text>

  <rect x="1150" y="285" width="170" height="72" class="card registry"/>
  <text x="1216" y="315" class="box-title">npm</text>
  <text x="1171" y="338" class="small">TypeScript, browser, tooling consumers</text>

  <rect x="50" y="420" width="1030" height="310" class="group"/>
  <text x="74" y="453" class="section">Atlas runtime layer</text>

  <rect x="80" y="485" width="360" height="170" class="card runtime"/>
  <text x="102" y="517" class="box-title">atlas-community</text>
  <text x="102" y="544" class="box-body">AGPL community runtime and self-hosted app.</text>
  <text x="102" y="566" class="box-body">Consumes Vev.Atlas.Contracts from NuGet.</text>
  <text x="102" y="588" class="box-body">Exports/imports the canonical atlas-contracts JSON.</text>
  <text x="102" y="610" class="box-body">Uses Fabric-shaped abstractions for cross-cutting concerns.</text>
  <text x="102" y="640" class="small">Today: local Fabric shim in repo, pending package swap.</text>

  <rect x="500" y="485" width="310" height="170" class="card private"/>
  <text x="522" y="517" class="box-title">atlas-enterprise</text>
  <text x="522" y="544" class="box-body">Private paid modules and analysis.</text>
  <text x="522" y="566" class="box-body">Depends on the same public contracts,</text>
  <text x="522" y="588" class="box-body">not on atlas-community internals.</text>
  <text x="522" y="618" class="small">Unlocks through Fabric entitlements.</text>

  <rect x="870" y="485" width="180" height="170" class="card note"/>
  <text x="892" y="517" class="box-title">Community modules</text>
  <text x="892" y="544" class="box-body">Import/export adapters,</text>
  <text x="892" y="566" class="box-body">tooling and other ecosystem</text>
  <text x="892" y="588" class="box-body">extensions build on</text>
  <text x="892" y="610" class="box-body">atlas-contracts.</text>

  <rect x="50" y="765" width="1030" height="170" class="group"/>
  <text x="74" y="798" class="section">Adjacent pattern: Portic community follows the same split</text>

  <rect x="80" y="825" width="360" height="78" class="card runtime"/>
  <text x="102" y="856" class="box-title">portic-community</text>
  <text x="102" y="881" class="box-body">AGPL gateway runtime. SPI is local today, intended to move to portic-sdk.</text>

  <rect x="500" y="825" width="280" height="78" class="card public"/>
  <text x="522" y="856" class="box-title">portic-sdk</text>
  <text x="522" y="881" class="box-body">Apache SDK/SPI boundary for consumers and adapters.</text>

  <rect x="840" y="825" width="210" height="78" class="card public"/>
  <text x="862" y="856" class="box-title">fabric</text>
  <text x="862" y="881" class="box-body">Owns the shared platform concerns.</text>

  <rect x="1120" y="420" width="230" height="515" class="group"/>
  <text x="1144" y="453" class="section">Why split contracts out?</text>
  <text x="1150" y="494" class="box-body">1. One canonical schema and wire model.</text>
  <text x="1150" y="532" class="box-body">2. Runtime code can stay AGPL while</text>
  <text x="1170" y="554" class="box-body">shared contracts stay Apache.</text>
  <text x="1150" y="592" class="box-body">3. .NET backends consume via NuGet.</text>
  <text x="1150" y="630" class="box-body">4. TS tooling and browser-side consumers</text>
  <text x="1170" y="652" class="box-body">consume the same model via npm.</text>
  <text x="1150" y="690" class="box-body">5. Third parties validate against the</text>
  <text x="1170" y="712" class="box-body">same published schemas.</text>
  <text x="1150" y="750" class="box-body">6. Enterprise depends on public packages,</text>
  <text x="1170" y="772" class="box-body">not on community internals.</text>
  <text x="1150" y="810" class="box-body">7. Local, CI and container builds all</text>
  <text x="1170" y="832" class="box-body">restore the same published contracts</text>
  <text x="1170" y="854" class="box-body">package from nuget.org.</text>

  <!-- Row 1 — the shared contracts publish to the registries. Routed above the card band and down the
       clear gap between the two groups, so they never cross the portic-sdk card that sits between
       atlas-contracts and the registries. -->
  <path d="M 640 185 V 166 H 1092 V 226 H 1150" class="line line-green" marker-end="url(#arrowGreen)"/>
  <path d="M 690 185 V 176 H 1104 V 321 H 1150" class="line line-green dashed" marker-end="url(#arrowGreen)"/>
  <text x="650" y="160" class="label">atlas-contracts → NuGet + npm</text>

  <path d="M 1050 262 H 1150" class="line line-green dashed" marker-end="url(#arrowGreen)"/>
  <text x="1052" y="284" class="small">SDK/SPI packages</text>

  <!-- Row 2 — both runtimes consume the SAME public contracts (the key message). Verticals drop into
       the clear gap between the contract layer and the runtime layer; labels sit in that gap. -->
  <path d="M 150 345 V 485" class="line line-blue dashed" marker-end="url(#arrowBlue)"/>
  <text x="162" y="408" class="label">Fabric abstractions (package later)</text>

  <path d="M 430 345 V 485" class="line line-blue" marker-end="url(#arrowBlue)"/>
  <text x="452" y="408" class="label">consumes atlas-contracts</text>

  <path d="M 650 345 V 485" class="line line-blue" marker-end="url(#arrowBlue)"/>
  <text x="662" y="404" class="label">same public contracts,</text>
  <text x="662" y="422" class="label">not community internals</text>

  <!-- community modules build on the public contract layer -->
  <path d="M 960 485 V 390" class="line line-gray dashed" marker-end="url(#arrowGray)"/>

  <!-- one published package surface, consumed the same way across local, CI and container builds -->
  <path d="M 470 700 H 1112" class="line line-gray dashed" marker-end="url(#arrowGray)"/>
  <text x="700" y="688" class="label">same published packages across local, CI and container builds</text>

  <!-- Bottom row — Portic mirrors the split. Short connectors in the gaps; labels in the clear strip
       above the cards. -->
  <path d="M 440 864 H 500" class="line line-red" marker-end="url(#arrowRed)"/>
  <text x="300" y="815" class="label">same split idea</text>

  <path d="M 780 864 H 840" class="line line-blue" marker-end="url(#arrowBlue)"/>
  <text x="726" y="815" class="label">shared platform concerns</text>
</svg>
